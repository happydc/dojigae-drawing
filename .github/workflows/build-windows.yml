name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "릴리스로 게시할 태그 (예: v1.0.0). 비우면 빌드만"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Smoke test (generate drawings)
        run: |
          python dojigae_core.py
          python dojigae_3d.py
          python dojigae_viewer.py
      - name: Build exe
        run: pyinstaller --noconfirm --onefile --windowed --collect-all manifold3d --icon assets/icon.ico --add-data "assets/icon.png;assets" --name GakgungDojigae dojigae_gui.py
      - uses: actions/upload-artifact@v4
        with:
          name: GakgungDojigae-windows
          path: dist/GakgungDojigae.exe
      - name: Release (tag push / release / manual tag)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: ${{ inputs.release_tag && format('{0} — 각궁도지개 제작도면 생성기', inputs.release_tag) || '' }}
          body_path: .github/release-notes.md
          target_commitish: ${{ github.sha }}
          files: dist/GakgungDojigae.exe
