name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Smoke test (generate drawings)
        run: |
          python dojigae_core.py
          python dojigae_3d.py
          python dojigae_viewer.py
      - name: Build exe
        run: pyinstaller --noconfirm --onefile --windowed --name GakgungDojigae dojigae_gui.py
      - uses: actions/upload-artifact@v4
        with:
          name: GakgungDojigae-windows
          path: dist/GakgungDojigae.exe
      - name: Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GakgungDojigae.exe
